services:
  # Backend Service (FastAPI)
  backend:
    build: ./backend
    container_name: beamstate-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Timezone
      - TZ=Europe/Brussels
    volumes:
      - ./backend/data:/app/data # For SQLite DB and Logs
      - ./backend/config.json:/app/config.json # Persistence for Config Blueprint
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/status', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - beamstate-net

  # Frontend Service (React/Nginx)
  frontend:
    build: ./frontend
    container_name: beamstate-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - beamstate-net

networks:
  beamstate-net:
    driver: bridge
